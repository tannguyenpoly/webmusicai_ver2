<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: dynamic(~{:: #workspace-area})}">
<body>
    <div id="workspace-area" class="container m-0 p-0" style="max-width: 100%;" v-cloak>
        <section class="app-surface-card explore-page-hero mb-4">
            <h1>Khám phá nhạc và người sáng tạo</h1>
            <div class="explore-search d-flex align-items-center">
                <i class="ti ti-search text-muted-sync me-2"></i>
                <input v-model="filters.keyword" class="form-control border-0 bg-transparent" type="search" placeholder="Tìm bài nhạc hoặc tác giả..." aria-label="Tìm bài nhạc hoặc tác giả">
                <button v-if="filters.keyword" @click="filters.keyword = ''" class="btn btn-sm border-0 text-muted-sync"><i class="ti ti-x"></i></button>
                <span class="explore-search-count">{{ filteredSongs.length }} bài</span>
            </div>
            <div v-if="genres.length || availableTags.length" class="explore-filter-panel explore-filter-panel-inline">
                <div v-if="genres.length" class="explore-filter-group">
                    <button v-for="genre in genres" :key="genre.id" @click="selectedExploreGenreId = selectedExploreGenreId === genre.id ? null : genre.id" class="explore-genre-chip" :class="{ active: selectedExploreGenreId === genre.id }">{{ genre.name }}</button>
                </div>
                <div v-if="availableTags.length" class="explore-filter-group">
                    <button v-for="tag in availableTags" :key="tag.id" @click="selectedExploreTagId = selectedExploreTagId === tag.id ? null : tag.id" class="explore-genre-chip" :class="{ active: selectedExploreTagId === tag.id }">#{{ tag.name }}</button>
                    <span v-if="isLoadingExploreTag" class="explore-filter-loading"><span class="spinner-border spinner-border-sm me-1"></span>Đang lọc</span>
                </div>
                <button v-if="selectedExploreGenreId !== null || selectedExploreTagId !== null" @click="selectedExploreGenreId = null; selectedExploreTagId = null" class="explore-filter-reset"><i class="ti ti-refresh me-1"></i>Xóa lọc</button>
            </div>
        </section>

        <template v-if="filters.keyword.trim() !== ''">
            <section v-if="matchingCreators.length" class="explore-section">
                <div class="explore-section-head"><h2 class="explore-section-title">Tác giả</h2></div>
                <div class="creator-search-grid">
                    <article v-for="creator in matchingCreators" :key="creator.username" class="explore-result-card">
                        <img :src="formatAvatarUrl(creator.photo, creator.fullname || creator.username)" @error="onImageError($event)" class="creator-avatar" alt="Ảnh đại diện tác giả">
                        <h3 class="creator-name">{{ creator.fullname || creator.username }}</h3><div class="creator-handle">@{{ creator.username }}</div>
                        <div class="creator-metrics"><span><i class="ti ti-music me-1"></i>{{ creator.total_songs || 0 }} bài</span></div>
                        <a :href="'/profile?username=' + creator.username" class="creator-profile-link">Xem hồ sơ</a>
                    </article>
                </div>
            </section>
            <section class="explore-section">
                <div class="explore-section-head"><h2 class="explore-section-title">Bài nhạc</h2></div>
                <div v-if="filteredSongs.length" class="explore-song-grid">
                    <article v-for="song in filteredSongs.slice(0, 10)" :key="song.id" class="explore-song-card" @click="goToSongDetail(song.id)">
                        <div class="explore-song-art"><img :src="getSongCover(song)" @error="onImageError($event, 'cover')" alt="Ảnh bìa bài hát"><button @click.stop="playTrack(song)" class="explore-song-play" :aria-label="'Phát ' + song.title"><i :class="['ti', isTrackPlaying(song.id) ? 'ti-player-pause' : 'ti-player-play-filled']"></i></button><button @click.stop="toggleLike(song)" class="explore-song-like" :class="{ 'is-liked': song.liked_by_me }"><i :class="song.liked_by_me ? 'ti ti-heart-filled' : 'ti ti-heart'"></i></button><span class="explore-song-stat"><i class="ti ti-headphones me-1"></i>{{ getListensCount(song) }}</span></div>
                        <h3 class="explore-song-title">{{ song.title }}</h3><div class="explore-song-author">{{ song.authorName || song.username || 'MusicAI' }}</div>
                    </article>
                </div>
                <div v-else class="app-empty-state"><i class="ti ti-search-off d-block mb-2 fs-3"></i>Không tìm thấy nội dung phù hợp.</div>
            </section>
        </template>

        <template v-else-if="exploreSection === 'creators'">
            <section class="explore-section"><div class="explore-section-head"><div><button @click="closeExploreSection" class="explore-see-all explore-back-button mb-3"><i class="ti ti-arrow-left me-1"></i>Quay lại</button><h2 class="explore-section-title">Tất cả tác giả nổi bật</h2></div></div><div class="creator-search-grid"><article v-for="creator in featuredCreators" :key="creator.username" class="creator-card"><img :src="formatAvatarUrl(creator.photo, creator.name || creator.username)" @error="onImageError($event)" class="creator-avatar" alt="Ảnh đại diện tác giả"><h3 class="creator-name">{{ creator.name }}</h3><div class="creator-handle">@{{ creator.username }}</div><div class="creator-metrics"><span><i class="ti ti-music me-1"></i>{{ creator.songCount }} bài</span><span><i class="ti ti-heart me-1"></i>{{ creator.likes }}</span></div><a :href="'/profile?username=' + creator.username" class="creator-profile-link">Xem hồ sơ</a></article></div></section>
        </template>

        <template v-else-if="exploreSection">
            <section class="explore-section"><div class="explore-section-head"><div><button @click="closeExploreSection" class="explore-see-all explore-back-button mb-3"><i class="ti ti-arrow-left me-1"></i>Quay lại</button><h2 class="explore-section-title">{{ exploreSection === 'trending' ? 'Đang thịnh hành' : 'Mới phát hành' }}</h2></div></div><div class="explore-song-grid"><article v-for="song in activeExploreSongs.slice(0, 10)" :key="song.id" class="explore-song-card" @click="goToSongDetail(song.id)"><div class="explore-song-art"><img :src="getSongCover(song)" @error="onImageError($event, 'cover')" alt="Ảnh bìa bài hát"><button @click.stop="playTrack(song)" class="explore-song-play"><i :class="['ti', isTrackPlaying(song.id) ? 'ti-player-pause' : 'ti-player-play-filled']"></i></button><button @click.stop="toggleLike(song)" class="explore-song-like" :class="{ 'is-liked': song.liked_by_me }"><i :class="song.liked_by_me ? 'ti ti-heart-filled' : 'ti ti-heart'"></i></button><span class="explore-song-stat"><i class="ti ti-headphones me-1"></i>{{ getListensCount(song) }}</span></div><h3 class="explore-song-title">{{ song.title }}</h3><div class="explore-song-author">{{ song.authorName || song.username || 'MusicAI' }}</div></article></div></section>
        </template>

        <template v-else>
            <section id="explore-trending" class="explore-section"><div class="explore-section-head"><h2 class="explore-section-title">Đang thịnh hành</h2><button @click="openExploreSection('trending')" class="explore-see-all">Xem tất cả <i class="ti ti-arrow-right"></i></button></div><div class="explore-song-row"><article v-for="song in trendingSongs.slice(0, 5)" :key="song.id" class="explore-song-card" @click="goToSongDetail(song.id)"><div class="explore-song-art"><img :src="getSongCover(song)" @error="onImageError($event, 'cover')" alt="Ảnh bìa bài hát"><button @click.stop="playTrack(song)" class="explore-song-play" :aria-label="'Phát ' + song.title"><i :class="['ti', isTrackPlaying(song.id) ? 'ti-player-pause' : 'ti-player-play-filled']"></i></button><button @click.stop="toggleLike(song)" class="explore-song-like" :class="{ 'is-liked': song.liked_by_me }"><i :class="song.liked_by_me ? 'ti ti-heart-filled' : 'ti ti-heart'"></i></button><span class="explore-song-stat"><i class="ti ti-headphones me-1"></i>{{ getListensCount(song) }}</span></div><h3 class="explore-song-title">{{ song.title }}</h3><div class="explore-song-author">{{ song.authorName || song.username || 'MusicAI' }}</div></article></div></section>
            <section id="explore-new" class="explore-section"><div class="explore-section-head"><h2 class="explore-section-title">Mới phát hành</h2><button @click="openExploreSection('new')" class="explore-see-all">Xem tất cả <i class="ti ti-arrow-right"></i></button></div><div class="explore-song-row"><article v-for="song in newReleaseSongs.slice(0, 5)" :key="song.id" class="explore-song-card" @click="goToSongDetail(song.id)"><div class="explore-song-art"><img :src="getSongCover(song)" @error="onImageError($event, 'cover')" alt="Ảnh bìa bài hát"><button @click.stop="playTrack(song)" class="explore-song-play" :aria-label="'Phát ' + song.title"><i :class="['ti', isTrackPlaying(song.id) ? 'ti-player-pause' : 'ti-player-play-filled']"></i></button><button @click.stop="toggleLike(song)" class="explore-song-like" :class="{ 'is-liked': song.liked_by_me }"><i :class="song.liked_by_me ? 'ti ti-heart-filled' : 'ti ti-heart'"></i></button><span class="explore-song-stat"><i class="ti ti-headphones me-1"></i>{{ getListensCount(song) }}</span></div><h3 class="explore-song-title">{{ song.title }}</h3><div class="explore-song-author">{{ song.authorName || song.username || 'MusicAI' }}</div></article></div></section>
            <section id="explore-creators" class="explore-section"><div class="explore-section-head"><h2 class="explore-section-title">Tác giả nổi bật</h2><button @click="openExploreSection('creators')" class="explore-see-all">Xem tác giả <i class="ti ti-arrow-right"></i></button></div><div class="creator-row"><article v-for="creator in featuredCreators.slice(0, 5)" :key="creator.username" class="creator-card"><img :src="formatAvatarUrl(creator.photo, creator.name || creator.username)" @error="onImageError($event)" class="creator-avatar" alt="Ảnh đại diện tác giả"><h3 class="creator-name">{{ creator.name }}</h3><div class="creator-handle">@{{ creator.username }}</div><div class="creator-metrics"><span><i class="ti ti-music me-1"></i>{{ creator.songCount }} bài</span><span><i class="ti ti-heart me-1"></i>{{ creator.likes }}</span></div><a :href="'/profile?username=' + creator.username" class="creator-profile-link">Xem hồ sơ</a></article></div></section>
            <section v-if="communityCollections.length" class="explore-section">
                <div class="explore-section-head"><h2 class="explore-section-title">Bộ sưu tập từ cộng đồng</h2></div>
                <div class="community-collection-grid"><article v-for="collection in communityCollections" :key="collection.type + '-' + collection.id" class="community-collection-card" @click="openCollection(collection.type, collection.id)"><div class="community-collection-icon" :class="{ album: collection.type === 'ALBUM' }"><i :class="collection.type === 'ALBUM' ? 'ti ti-disc' : 'ti ti-playlist'"></i></div><div class="min-w-0"><span class="community-collection-type">{{ collection.type === 'ALBUM' ? 'Album' : 'Playlist' }}</span><h3>{{ collection.title }}</h3><p>{{ collection.songCount }} bài · {{ collection.authorName || collection.username }}</p></div><i class="ti ti-chevron-right collection-arrow"></i></article></div>
            </section>
        </template>
    </div>
</body>
</html>

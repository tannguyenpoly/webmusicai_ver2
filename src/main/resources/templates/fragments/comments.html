<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="comments-section" class="comment-section">
        <h4 class="comment-heading"><i class="ti ti-message-circle-2 text-success me-2"></i>Bình luận ({{ commentPagination.totalElements }})</h4>

        <div v-if="currentUser" class="comment-composer">
            <textarea v-model="newComment.content" class="form-control custom-theme-input" rows="3" placeholder="Viết bình luận của bạn..."></textarea>
            <div class="comment-send-row"><button @click="postComment(currentTrack.id)" :disabled="isSubmittingComment || !newComment.content.trim()" class="btn btn-main-sync px-4"><span v-if="isSubmittingComment" class="spinner-border spinner-border-sm me-1"></span><i v-else class="ti ti-send me-1"></i>Gửi bình luận</button></div>
        </div>
        <div v-else class="comment-guest"><a href="/login" class="text-success fw-bold">Đăng nhập</a> để tham gia bình luận.</div>

        <div v-if="isLoadingComments" class="text-center py-4"><span class="spinner-border text-success"></span></div>
        <div v-else>
            <template v-for="(comment, index) in commentPagination.content">
                <article :key="comment.id" class="comment-item">
                    <a :href="'/profile?u=' + comment.user.username"><img :src="formatAvatarUrl(comment.user.photo, comment.user.fullname || comment.user.username)" @error="onImageError($event)" class="comment-avatar" alt="Ảnh đại diện"></a>
                    <div class="comment-main">
                        <div v-if="editingComment && editingComment.id === comment.id" class="comment-edit">
                            <textarea v-model="editingComment.content" class="form-control custom-theme-input" rows="2"></textarea>
                            <div class="comment-send-row"><button @click="cancelEditComment" class="btn btn-sm btn-register-sync me-2">Hủy</button><button @click="saveComment(comment)" :disabled="isSubmittingComment" class="btn btn-sm btn-main-sync">Lưu</button></div>
                        </div>
                        <div v-else class="comment-bubble"><a :href="'/profile?u=' + comment.user.username" class="comment-author">{{ comment.user.fullname || comment.user.username }}</a><span class="comment-time">{{ formatRelativeTime(comment.createdAt) }}</span><p class="comment-body">{{ comment.content }}</p></div>
                        <div v-if="!editingComment || editingComment.id !== comment.id" class="comment-actions"><button v-if="currentUser" @click="toggleReplyForm(comment.id)" class="comment-action-btn">Trả lời</button><button v-if="currentUser === comment.user.username" @click="editComment(comment)" class="comment-action-btn">Sửa</button><button v-if="currentUser === comment.user.username || isAdmin" @click="deleteComment(comment.id, index, null)" class="comment-action-btn text-danger">Xóa</button></div>
                        <div v-if="replyingToCommentId === comment.id" class="comment-reply-form"><textarea v-model="newReply.content" class="form-control custom-theme-input" rows="2" :placeholder="'Trả lời ' + (comment.user.fullname || comment.user.username) + '...'"></textarea><div class="comment-send-row"><button @click="toggleReplyForm(null)" class="btn btn-sm btn-register-sync me-2">Hủy</button><button @click="postComment(currentTrack.id, comment.id)" :disabled="isSubmittingComment || !newReply.content.trim()" class="btn btn-sm btn-main-sync">Gửi trả lời</button></div></div>
                        <div v-if="comment.replies && comment.replies.length" class="comment-replies">
                            <article v-for="(reply, replyIndex) in comment.replies" :key="reply.id" class="comment-item">
                                <a :href="'/profile?u=' + reply.user.username"><img :src="formatAvatarUrl(reply.user.photo, reply.user.fullname || reply.user.username)" @error="onImageError($event)" class="comment-avatar" alt="Ảnh đại diện"></a>
                                <div class="comment-main"><div v-if="editingComment && editingComment.id === reply.id" class="comment-edit"><textarea v-model="editingComment.content" class="form-control custom-theme-input" rows="2"></textarea><div class="comment-send-row"><button @click="cancelEditComment" class="btn btn-sm btn-register-sync me-2">Hủy</button><button @click="saveComment(reply)" :disabled="isSubmittingComment" class="btn btn-sm btn-main-sync">Lưu</button></div></div><template v-else><div class="comment-bubble"><a :href="'/profile?u=' + reply.user.username" class="comment-author">{{ reply.user.fullname || reply.user.username }}</a><span class="comment-time">{{ formatRelativeTime(reply.createdAt) }}</span><p class="comment-body">{{ reply.content }}</p></div><div class="comment-actions"><button v-if="currentUser === reply.user.username" @click="editComment(reply)" class="comment-action-btn">Sửa</button><button v-if="currentUser === reply.user.username || isAdmin" @click="deleteComment(reply.id, replyIndex, index)" class="comment-action-btn text-danger">Xóa</button></div></template></div>
                            </article>
                        </div>
                    </div>
                </article>
            </template>
            <div v-if="commentPagination.number < commentPagination.totalPages - 1" class="text-center mt-4"><button @click="loadComments(currentTrack.id, true)" class="btn btn-main-sync px-4">Tải thêm bình luận</button></div>
            <div v-if="commentPagination.content.length === 0" class="text-center text-muted-sync py-4">Chưa có bình luận nào. Hãy là người đầu tiên!</div>
        </div>
    </section>
</body>
</html>

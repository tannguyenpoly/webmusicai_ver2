<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="text-center py-4 mt-5"
        style="background: var(--card-bg) !important; border-top: 1px solid var(--border-color); transition: background 0.3s, border-color 0.3s;">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-md-start mb-2 mb-md-0">
                <p class="mb-0 small" style="color: var(--text-color); opacity: 0.8;">
                    © 2026 Hệ Thống Thiết Kế Giai Điệu Âm Nhạc Tự Động <span class="text-success fw-bold">MusicAI</span>.
                </p>
                <small style="color: var(--text-color); opacity: 0.6; font-size: 11px;">Sản phẩm thuộc Phân hệ báo cáo Môn Thực Tập FPoly.</small>
            </div>
            <div class="col-md-6 text-md-end">
                <span class="px-3 py-1.5 rounded-pill d-inline-block small"
                      style="background: rgba(25, 135, 84, 0.1); color: #2ecc71; border: 1px solid rgba(25, 135, 84, 0.2); font-weight: 500; letter-spacing: 0.5px;">
                </span>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
